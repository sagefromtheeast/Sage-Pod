name: CodeQL

# Static security analysis of the TypeScript code (Kotlin would need a full
# Gradle build in CI). GitHub only
# offers code scanning free on public repositories, so the job skips itself
# while the repository is private.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '27 4 * * 1'

permissions: {}

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:javascript-typescript
